        attributes:
          $ref: '#/components/schemas/SigningKeys.SigningKeyWithSecret'
        relationships:
          $ref: '#/components/schemas/SigningKeys.SigningKeyRelationships'
      description: A signing key resource carrying the secret of the version just created or promoted.
