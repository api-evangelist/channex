          examples:
          - '0.00'
        infant_fee:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.decimalString'
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: 'Additional fee added to the normal price for an Infant guest (per Hotel Age Policy): a decimal string, or an integer in the currency''s minor units.'
          examples:
          - '0.00'
        max_stay:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          - type: array
            items:
              $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: 'Default Max Stay restriction: a single value for every weekday, or 7 per-weekday values, Monday first. `0` means no limit.'
        min_stay_arrival:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.positiveInt'
          - type: array
            items:
              $ref: '#/components/schemas/Common.Scalars.positiveInt'
          description: 'Default Min Stay Arrival restriction: a single value for every weekday, or 7 per-weekday values, Monday first.'
        min_stay_through:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.positiveInt'
          - type: array
            items:
              $ref: '#/components/schemas/Common.Scalars.positiveInt'
          description: 'Default Min Stay Through restriction: a single value for every weekday, or 7 per-weekday values, Monday first.'
        closed_to_arrival:
          anyOf:
          - type: boolean
          - type: array
            items:
              type: boolean
          description: 'Default Closed To Arrival restriction: a single value for every weekday, or 7 per-weekday values, Monday first.'
        closed_to_departure:
          anyOf:
          - type: boolean
          - type: array
            items:
              type: boolean
          description: 'Default Closed To Departure restriction: a single value for every weekday, or 7 per-weekday values, Monday first.'
        stop_sell:
          anyOf:
          - type: boolean
          - type: array
            items:
              type: boolean
          description: 'Default Stop Sell restriction: a single value for every weekday, or 7 per-weekday values, Monday first.'
      description: Rate plan attributes accepted when creating a rate plan. A new rate plan gets default per-day values (rate 0, stop sell off, min stay 1) — use the ARI endpoints to send values per day.
    RatePlans.DerivedOption:
      type: object
      properties:
        rate:
          type: array
          items:
            type: array
            prefixItems:
            - type: string
              enum:
              - increase_by_amount
              - increase_by_percent
              - decrease_by_amount
              - decrease_by_percent
              description: 'A value-modification rule, applied to the original value with the step''s argument.

                `increase_by_amount` — add the amount.

                `increase_by_percent` — increase by the percent.

                `decrease_by_amount` — subtract the amount.

                `decrease_by_percent` — decrease by the percent.'
            - type: string
          description: Modification steps for the rate, applied to the original value in order; empty to derive the rate unchanged. Each step is `[rule, argument]` with the argument as a decimal string; the rules are `increase_by_amount`, `increase_by_percent`, `decrease_by_amount` and `decrease_by_percent`.
          examples:
          - - - increase_by_percent
              - '5.00'
            - - increase_by_amount
              - '12.00'
      description: 'Rules deriving a value from the Parent Rate Plan or from the primary occupancy option, keyed by the restriction they modify — `rate`.


        Each step is a two-item array — the rule, then its argument as a decimal string:


        - `increase_by_amount` — add the amount

        - `increase_by_percent` — increase by the percent

        - `decrease_by_amount` — subtract the amount

        - `decrease_by_percent` — decrease by the percent


        Steps apply to the original value in order, from left to right, and their number is not limited. For an original rate of 100.00:


        ```json

        {"rate": [["increase_by_percent", "5.00"], ["increase_by_amount", "12.00"]]}

        ```


        100.00 + 5% = 105.00, then 105.00 + 12.00 = 117.00.


        An empty list, `{"rate": []}`, derives the value unchanged.'
    RatePlans.AutoRateMode:
      type: string
      enum:
      - $
      - '%'
      description: 'How an automatic rate adjustment is expressed: `$` for an amount, `%` for a percent.'
