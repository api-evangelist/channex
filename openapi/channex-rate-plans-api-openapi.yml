          description: 'Whether `rate` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        inherit_closed_to_arrival:
          type: boolean
          description: 'Whether `closed_to_arrival` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        inherit_closed_to_departure:
          type: boolean
          description: 'Whether `closed_to_departure` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        inherit_stop_sell:
          type: boolean
          description: 'Whether `stop_sell` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        inherit_min_stay_arrival:
          type: boolean
          description: 'Whether `min_stay_arrival` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        inherit_min_stay_through:
          type: boolean
          description: 'Whether `min_stay_through` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        inherit_max_stay:
          type: boolean
          description: 'Whether `max_stay` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        inherit_max_availability:
          type: boolean
          description: 'Whether `max_availability` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        inherit_availability_offset:
          type: boolean
          description: 'Whether `availability_offset` follows the Parent Rate Plan: when `true`, the value is derived from the parent on every change and cannot be set on this rate plan directly. Defaults to `false`; `true` requires `parent_rate_plan_id`.'
        property_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: UUID of the Property to associate with the rate plan. Cannot be changed after creation.
        room_type_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: UUID of the Room Type the rate plan sells. Must belong to the Property. Cannot be changed after creation.
        parent_rate_plan_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: 'UUID of the Rate Plan to derive this rate plan from. Must be a rate plan of the same Property; it may sell another Room Type. When set on create without `rate_mode`, the rate plan is created with `rate_mode: derived`. `null` detaches the parent.'
        options:
          type: array
          items:
            $ref: '#/components/schemas/RatePlans.OccupancyOptionWrite'
          description: 'Occupancy options. A `per_room` rate plan takes one option for the maximum occupancy; a `per_person` rate plan takes an option per possible count of adult guests. The set of options is fixed at creation: an update can change them but not add or remove one.


            Exactly one option has `is_primary: true`, whatever the `rate_mode` (`cascade` included); no primary option, or more than one, is refused with `422` (`details.options: ["should have exactly one primary option"]`). Each occupancy appears once — `2` and `"2"` count as the same value; a repeated occupancy is refused with `422` (`details.options: ["occupancy 2 is duplicated"]`, several values sorted and joined: `"occupancy 1, 2 is duplicated"`). An `occupancy` that is neither an integer nor a string that parses as one (for example `"five"`) is refused with `422` (`details.options: ["occupancy is invalid"]`).


            The options are validated as a whole: an invalid option, primary or not, fails the request and nothing is created. The response carries every option created.'
        auto_rate_settings:
          anyOf:
          - $ref: '#/components/schemas/RatePlans.AutoRateSettingsWrite'
          - type: 'null'
          description: How rate options are derived from the primary occupancy option. Applied only when `rate_mode` is `auto`; when `rate_mode` is `auto` and nothing is sent, zero-valued amount settings are stored.
        children_fee:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.decimalString'
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
