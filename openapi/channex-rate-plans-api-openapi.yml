      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatePlans.RatePlanUpdateRequest'
    delete:
      operationId: RatePlans_delete
      summary: Delete a rate plan
      description: Delete a rate plan by its identifier. A rate plan mapped to a channel is refused with `422 Unprocessable Entity` unless `force=true` is sent. Rate plans derived from it (those with it as `parent_rate_plan_id`) are deleted with it.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
      - name: force
        in: query
        required: false
        description: 'Delete the rate plan even when it is mapped to a channel: the mappings are removed with it and the channel notified. Without it the request fails when channel mappings would be affected. Irreversible: neither the rate plan nor its channel information can be restored.'
        schema:
          type: boolean
        explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.JsonApi.SuccessMessage'
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFound'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.ValidationError'
      tags:
      - Rate Plans
components:
