    RatePlans.OccupancyOptionWrite:
      type: object
      required:
      - occupancy
      - is_primary
      properties:
        occupancy:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.positiveInt'
          description: Count of guests allowed for this occupancy option. At most the Room Type's `occ_adults`; each occupancy appears once, and `2` and `"2"` count as the same occupancy.
          examples:
          - 3
        is_primary:
          type: boolean
          description: Marks the main occupancy option — the base point for derived calculations. Exactly one option of a rate plan is primary.
        derived_option:
          anyOf:
          - $ref: '#/components/schemas/RatePlans.DerivedOption'
          - type: 'null'
          description: 'Rules deriving this option''s values from the Parent Rate Plan or the primary occupancy option, keyed by the restriction they modify — `rate`. Defaults to `{"rate": []}`, derive the rate unchanged, when the rate plan has a parent.


            Each step is a two-item array — the rule, then its argument as a decimal string:


            - `increase_by_amount` — add the amount

            - `increase_by_percent` — increase by the percent

            - `decrease_by_amount` — subtract the amount

            - `decrease_by_percent` — decrease by the percent


            Steps apply to the original value in order, from left to right, and their number is not limited. For an original rate of 100.00:


            ```json

            {"rate": [["increase_by_percent", "5.00"], ["increase_by_amount", "12.00"]]}

            ```


            100.00 + 5% = 105.00, then 105.00 + 12.00 = 117.00.


            An empty list, `{"rate": []}`, derives the value unchanged.'
        rate:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.decimalString'
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: 'Default rate applied to each date of a new rate plan and to each future date newly opened in state: a decimal string like `"100.00"`, or an integer in the currency''s minor units. Defaults to `"0.00"`. A string that is not a number (for example `"abc"`) is refused with `422` (`details.rate: ["is invalid"]`); a negative value with `422` (`details.rate: ["must be greater than or equal to 0"]`).'
          examples:
          - '100.00'
      description: An occupancy option accepted on create and update. A `per_room` rate plan takes one option for the maximum occupancy; a `per_person` rate plan takes an option per possible count of adult guests.
