openapi: 3.2.0
info:
  title: Channex.io — Public Rate Plans API
  version: 0.0.0
  description: 'Manage Rate Plans — pricing plans of how to sell Room Types: prices per occupancy, rate derivation rules, and per-weekday restriction defaults.'
servers:
- url: https://app.channex.io/api/v1
  description: Production server
  variables: {}
- url: https://staging.channex.io/api/v1
  description: Staging server
  variables: {}
security:
- UserApiKeyAuth: []
tags:
- name: Rate Plans
  description: 'Manage Rate Plans — pricing plans of how to sell Room Types: prices per occupancy, rate derivation rules, and per-weekday restriction defaults.'
paths:
  /rate_plans:
    get:
      operationId: RatePlans_list
      summary: List rate plans
      description: List rate plans, including those a channel created for its own mapping. Results are paginated; the `meta` block carries the page, limit, total and ordering.
      parameters:
      - name: filter[property_id]
        in: query
        required: false
        description: Return only the rate plans of this property.
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
        explode: false
      - name: filter[room_type_id]
        in: query
        required: false
        description: Return only the rate plans of this room type.
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
        explode: false
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.page'
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.limit'
      - name: order[title]
        in: query
        required: false
        description: Order rate plans by title. Applied by default, ascending.
        schema:
          $ref: '#/components/schemas/Common.Pagination.OrderDirection'
        explode: false
      - $ref: '#/components/parameters/RatePlans.RatePlanListParams.orderInsertedAt'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RatePlans.RatePlanResource'
                  meta:
                    $ref: '#/components/schemas/Common.Pagination.PaginationMeta'
                description: JSON:API document wrapping a collection of resources with pagination meta.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.InvalidNestedArguments'
      tags:
      - Rate Plans
    post:
      operationId: RatePlans_create
      summary: Create a rate plan
      description: Create a rate plan for a room type. The created rate plan is returned with `201 Created`.
      parameters: []
