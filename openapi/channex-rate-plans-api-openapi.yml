          description: 'Rate plan currency, an ISO 4217 code. Defaults to the currency of the associated Property; a Property can have rate plans in different currencies. On create, an unsupported code is refused with `422` (`details.currency: ["is invalid"]`). Cannot be changed after creation: a value sent on update is ignored.'
        meal_type:
