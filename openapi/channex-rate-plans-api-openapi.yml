      - continental_breakfast
      - english_breakfast
      - european_plan
      - family_plan
      - full_board
      - full_breakfast
      - half_board
      - room_only
      - self_catering
      - bermuda
      - dinner_bed_and_breakfast_plan
      - family_american
      - breakfast_and_lunch
      - lunch_and_dinner
      description: Meal plan included in the rate plan.
    RatePlans.RatePlanUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Rate plan title, unique within a Room Type (case-sensitive). A title that is blank after trimming whitespace (for example `"   "`) is refused with `422` (`details.title: ["can''t be blank"]`).'
          examples:
          - Best Available Rate
        sell_mode:
          allOf:
          - $ref: '#/components/schemas/RatePlans.SellMode'
          description: 'How the rate plan is sold. Defaults to `per_room`. Cannot be changed after creation: on update a value other than the stored one is refused with `422` (`details.sell_mode: ["can''t be changed"]`); the stored value is accepted.'
        rate_mode:
          allOf:
          - $ref: '#/components/schemas/RatePlans.RateMode'
          description: How the rate is calculated. Defaults to `manual`.
        currency:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.currency'
          description: 'Rate plan currency, an ISO 4217 code. Defaults to the currency of the associated Property; a Property can have rate plans in different currencies. On create, an unsupported code is refused with `422` (`details.currency: ["is invalid"]`). Cannot be changed after creation: a value sent on update is ignored.'
        meal_type:
          anyOf:
          - $ref: '#/components/schemas/RatePlans.MealType'
          - type: 'null'
          description: Meal plan included in the rate plan. `none` by default; null once cleared.
        tax_set_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the Tax Set applied to the rate plan, or null. Defaults to the Property's default Tax Set. The tax set also appears under relationships.
        cancellation_policy_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the Cancellation Policy applied to the rate plan, or null.
