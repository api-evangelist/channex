    RatePlans.RateMode:
      type: string
      enum:
      - manual
      - derived
      - cascade
      - auto
      description: 'How the rate of the rate plan is calculated.

        `manual` — the price is the one set in `options[].rate`.

        `derived` — the price of the primary occupancy option is derived from the Parent Rate Plan.

        `cascade` — the price of every occupancy option is derived from the Parent Rate Plan; on create, an option is added for each occupancy from 1 to the Room Type''s `occ_adults` that the request does not name, each derived from the parent''s option of the same occupancy.

        `auto` — the price is calculated from the primary occupancy option''s price and `auto_rate_settings`.'
