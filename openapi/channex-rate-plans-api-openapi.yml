  /rate_plans/options:
    get:
      operationId: RatePlans_options
      summary: List rate plan options
      description: List rate plans as lightweight options for selectors. Not paginated. Rate plans a channel created for its own mapping are not listed.
      parameters:
      - name: filter[property_id]
        in: query
        required: false
        description: Return only the rate plans of this property.
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
        explode: false
      - name: filter[room_type_id]
        in: query
        required: false
        description: Return only the rate plans of this room type.
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
        explode: false
      - name: order[title]
        in: query
        required: false
        description: Order rate plans by title. Applied by default, ascending.
        schema:
          $ref: '#/components/schemas/Common.Pagination.OrderDirection'
        explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RatePlans.RatePlanOptionResource'
                description: A plain data-array envelope without pagination — used by reference/dictionary endpoints.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InvalidArguments'
      tags:
      - Rate Plans
