        ages:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          - type: 'null'
          description: Ages of the children, when `children` is not 0. Can be `null` in room occupancies.
      description: Occupancy breakdown by guest kind.
    BookingRevisions.BookingCustomer:
      type: object
