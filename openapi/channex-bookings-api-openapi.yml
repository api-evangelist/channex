        phone:
          anyOf:
          - type: string
          - type: 'null'
        language:
          anyOf:
          - type: string
          - type: 'null'
        country:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.country'
          - type: 'null'
        city:
          anyOf:
          - type: string
          - type: 'null'
        address:
          anyOf:
          - type: string
          - type: 'null'
        zip:
          anyOf:
          - type: string
          - type: 'null'
        state:
          anyOf:
          - type: string
          - type: 'null'
          description: Not present in every response variant.
        company:
          anyOf:
          - type: string
          - type: 'null'
          description: Not present in every response variant.
        meta:
          anyOf:
          - type: object
            unevaluatedProperties: {}
          - type: 'null'
          description: Free-form OTA-specific details (e.g. Booking.com `is_genius`).
      description: Information about the customer who made the booking.
    Common.Errors.InvalidNestedArguments:
      type: object
      required:
      - errors
      properties:
        errors:
          $ref: '#/components/schemas/Common.Errors.InvalidNestedArgumentsObject'
      description: The request has invalid arguments; `details` lists the messages per argument, one level deeper for an argument that is itself a group.
    Common.Pagination.OrderDirection:
      type: string
