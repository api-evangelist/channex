        | `BL` | Carte Bancaire |

        | `CU` | Unionpay Credit Card |

        | `DN` | Diners Club |

        | `DS` | Discover Card |

        | `EL` | Elo |

        | `JC` | Japanese Credit Bureau Credit Card |

        | `MA` | Maestro |

        | `MC` | Master Card |

        | `MI` | NSPK MIR |

        | `VI` | Visa |'
    BookingRevisions.AcknowledgeStatus:
