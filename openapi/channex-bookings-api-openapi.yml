    BookingRevisions.BookingRevision:
      type: object
      required:
      - id
      - booking_id
      - property_id
      - channel_id
      - unique_id
      - system_id
      - ota_reservation_code
      - ota_name
      - secondary_ota
      - status
      - acknowledge_status
      - rooms
      - services
      - guarantee
      - customer
      - occupancy
      - arrival_date
      - departure_date
      - arrival_hour
      - amount
      - currency
      - notes
      - deposits
      - agent
      - payment_collect
      - payment_type
      - ota_commission
      - inserted_at
      - meta
      - raw_message
      - is_crs_revision
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: Unique booking revision identifier.
          examples:
          - c64a3a6e-e38f-436e-a72e-8bd7e619b6fc
        booking_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: UUID of the associated Booking.
        property_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the associated Property. `null` for unmapped bookings.
        channel_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the associated Channel, when known.
        unique_id:
          type: string
          description: Unique booking identifier combined from the OTA code and the OTA reservation code. Usually the same for all revisions of a booking.
          examples:
          - BDC-4072171540
        system_id:
          type: string
          description: Unique message identifier at the booking source platform, unique per revision. Used for message deduplication.
        ota_reservation_code:
          type: string
          description: Original reservation code at the platform where the guest created the booking. Unique per booking message.
        ota_name:
          type: string
          description: Name of the OTA where the booking was originally created.
          examples:
          - BookingCom
        secondary_ota:
          anyOf:
          - type: string
          - type: 'null'
          description: Secondary OTA the booking came through, when applicable (e.g. `MakeMyTrip`).
        status:
          $ref: '#/components/schemas/BookingRevisions.BookingRevisionStatus'
        acknowledge_status:
          $ref: '#/components/schemas/BookingRevisions.AcknowledgeStatus'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/BookingRevisions.BookingRoom'
          description: Booking rooms. Can be empty (e.g. cancellation revisions).
        services:
          type: array
          items:
            $ref: '#/components/schemas/BookingRevisions.BookingService'
          description: Services at booking level.
        guarantee:
          anyOf:
          - $ref: '#/components/schemas/BookingRevisions.BookingGuarantee'
          - type: 'null'
          description: Credit card provided as payment guarantee, when present.
        customer:
          $ref: '#/components/schemas/BookingRevisions.BookingCustomer'
        occupancy:
          allOf:
          - $ref: '#/components/schemas/BookingRevisions.BookingOccupancy'
          description: Total booking occupancy.
        arrival_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Arrival date (`YYYY-MM-DD`). Can be `null` on cancellation revisions.
        departure_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Departure date (`YYYY-MM-DD`). Can be `null` on cancellation revisions.
        arrival_hour:
          anyOf:
          - type: string
          - type: 'null'
          description: Arrival time in `HH:MM` (24h) format.
          examples:
          - 02:00
        amount:
          type: string
          description: Total booking amount as a decimal string.
          examples:
          - '400.00'
        currency:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.currency'
          description: Booking currency code.
        notes:
          anyOf:
          - type: string
          - type: 'null'
          description: Customer notes for the booking.
        deposits:
          type: array
          items: {}
          description: Deposits associated with the booking.
        agent:
          description: Agent the booking was made through.
        payment_collect:
          anyOf:
          - $ref: '#/components/schemas/BookingRevisions.PaymentCollect'
          - type: 'null'
        payment_type:
          anyOf:
          - $ref: '#/components/schemas/BookingRevisions.PaymentType'
          - type: 'null'
        ota_commission:
          anyOf:
          - type: string
          - type: 'null'
          description: Commission amount charged by the OTA, as a decimal string. Currently available for Booking.com and Airbnb channels.
          examples:
          - '0.00'
        inserted_at:
          type: string
          format: date-time
          description: When the revision was received at Channex (ISO 8601, no timezone offset).
          examples:
          - '2026-07-21T12:12:36.919641'
        meta:
          type: object
          unevaluatedProperties: {}
          description: Free-form revision meta (e.g. `ruid`, `converter_version`, `source`).
        raw_message:
          type: string
          description: Raw message received from the booking source, as a string (JSON or OTA-specific payload).
        is_crs_revision:
          type: boolean
          description: Whether the revision was produced by the CRS (e.g. via the Bookings API) rather than received from an OTA feed.
      description: A booking revision — an immutable snapshot of a booking received from a booking source (a new booking, a modification, or a cancellation).
    BookingRevisions.PaymentCollect:
      type: string
      enum:
      - property
      - ota
      description: 'Who collects the payment: the property or the OTA (guest already paid at the OTA). `null` usually means the property collects it.'
    BookingRevisions.BookingOccupancy:
      type: object
      required:
      - adults
