openapi: 3.2.0
info:
  title: Channex.io — Public Bookings API
  version: 0.0.0
  description: Bookings received from the connected channels, together with the revisions they are built from. A booking is the current state of a reservation — the latest of its revisions; a revision is one parsed and normalised message from a booking source. Read bookings and their revisions, pull the feed of revisions not yet acknowledged, acknowledge what you received, and inspect the raw source message a revision was parsed from. To keep a PMS in step, pull the feed rather than polling the booking list; either source works for the initial pull.
servers:
- url: https://app.channex.io/api/v1
  description: Production server
  variables: {}
- url: https://staging.channex.io/api/v1
  description: Staging server
  variables: {}
security:
- UserApiKeyAuth: []
tags:
- name: Bookings
  description: Bookings received from the connected channels, together with the revisions they are built from. A booking is the current state of a reservation — the latest of its revisions; a revision is one parsed and normalised message from a booking source. Read bookings and their revisions, pull the feed of revisions not yet acknowledged, acknowledge what you received, and inspect the raw source message a revision was parsed from. To keep a PMS in step, pull the feed rather than polling the booking list; either source works for the initial pull.
paths:
  /booking_revisions:
    get:
      operationId: BookingRevisions_list
      summary: List booking revisions
      description: List booking revisions associated with the user's properties.
      parameters:
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.page'
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.limit'
      - $ref: '#/components/parameters/BookingRevisions.BookingRevisionListParams.orderInsertedAt'
      - $ref: '#/components/parameters/BookingRevisions.BookingRevisionListParams.filterPropertyId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - id
                      - attributes
                      - relationships
                      properties:
                        type:
                          type: string
                          enum:
                          - booking_revision
                        id:
                          $ref: '#/components/schemas/Common.Scalars.id'
                        attributes:
                          $ref: '#/components/schemas/BookingRevisions.BookingRevision'
                        relationships:
                          $ref: '#/components/schemas/BookingRevisions.BookingRevisionRelationships'
                      description: A JSON:API resource object with typed attributes and relationships.
                  meta:
                    $ref: '#/components/schemas/Common.Pagination.PaginationMeta'
                description: JSON:API document wrapping a collection of resources with pagination meta.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.InvalidNestedArguments'
      tags:
      - Bookings
  /booking_revisions/feed:
    get:
      operationId: BookingRevisions_feed
      summary: Pull the feed of unacknowledged revisions
      description: Feed of not yet acknowledged booking revisions — the primary way to pull bookings from Channex. Acknowledge every received revision via `ack`; an unacknowledged revision keeps being served for 30 minutes, after which a warning email is sent. Returns an empty list when everything is acknowledged.
      parameters:
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.page'
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.limit'
      - $ref: '#/components/parameters/BookingRevisions.BookingRevisionFeedParams.orderInsertedAt'
      - $ref: '#/components/parameters/BookingRevisions.BookingRevisionFeedParams.filterPropertyId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - id
                      - attributes
                      - relationships
                      properties:
                        type:
                          type: string
                          enum:
                          - booking_revision
                        id:
                          $ref: '#/components/schemas/Common.Scalars.id'
                        attributes:
                          $ref: '#/components/schemas/BookingRevisions.BookingRevision'
                        relationships:
                          $ref: '#/components/schemas/BookingRevisions.BookingRevisionRelationships'
                      description: A JSON:API resource object with typed attributes and relationships.
                  meta:
                    $ref: '#/components/schemas/Common.Pagination.PaginationMeta'
                description: JSON:API document wrapping a collection of resources with pagination meta.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.InvalidNestedArguments'
      tags:
      - Bookings
  /booking_revisions/{id}:
    get:
      operationId: BookingRevisions_read
      summary: Retrieve a booking revision
      description: Retrieve a specific booking revision by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - type
                    - id
                    - attributes
                    - relationships
                    properties:
                      type:
                        type: string
                        enum:
                        - booking_revision
                      id:
                        $ref: '#/components/schemas/Common.Scalars.id'
                      attributes:
                        $ref: '#/components/schemas/BookingRevisions.BookingRevision'
                      relationships:
                        $ref: '#/components/schemas/BookingRevisions.BookingRevisionRelationships'
                    description: A JSON:API resource object with typed attributes and relationships.
                description: JSON:API document wrapping a single resource.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFound'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InvalidArguments'
      tags:
      - Bookings
  /booking_revisions/{id}/ack:
    post:
      operationId: BookingRevisionAcknowledgements_ack
      summary: Acknowledge a booking revision
      description: Confirm receiving a booking revision by creating an acknowledge record. The revision stops appearing in the feed.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.JsonApi.SuccessMessage'
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '403':
          description: The authenticated user lacks permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Forbidden'
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFound'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InvalidArguments'
      tags:
      - Bookings
  /bookings:
    get:
      operationId: Bookings_list
      summary: List bookings
      description: List bookings associated with the user's properties.
      parameters:
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.page'
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.limit'
      - $ref: '#/components/parameters/Bookings.BookingListParams.orderInsertedAt'
      - $ref: '#/components/parameters/Bookings.BookingListParams.arrivalDateGte'
      - $ref: '#/components/parameters/Bookings.BookingListParams.arrivalDateLte'
      - $ref: '#/components/parameters/Bookings.BookingListParams.departureDateGte'
      - $ref: '#/components/parameters/Bookings.BookingListParams.departureDateLte'
      - $ref: '#/components/parameters/Bookings.BookingListParams.insertedAtGte'
      - $ref: '#/components/parameters/Bookings.BookingListParams.insertedAtLte'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookings.BookingResource'
                  meta:
                    $ref: '#/components/schemas/Common.Pagination.PaginationMeta'
                description: JSON:API document wrapping a collection of resources with pagination meta.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.InvalidNestedArguments'
      tags:
      - Bookings
  /bookings/{id}:
    get:
      operationId: Bookings_read
      summary: Retrieve a booking
      description: Retrieve a booking by ID. Returns the details of the booking's latest revision.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Bookings.BookingResource'
                description: JSON:API document wrapping a single resource.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFound'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InvalidArguments'
      tags:
      - Bookings
components:
  schemas:
    Bookings.BookingResource:
      type: object
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - booking
        id:
          $ref: '#/components/schemas/Common.Scalars.id'
        attributes:
          $ref: '#/components/schemas/Bookings.Booking'
      description: A booking resource.
    Common.Scalars.nonNegativeInt:
      type: integer
      format: int32
      minimum: 0
    Common.Scalars.positiveInt:
      type: integer
      format: int32
      minimum: 1
    Bookings.Booking:
      type: object
      required:
      - id
      - booking_id
      - revision_id
      - channel_id
      - unique_id
      - secondary_ota
      - acknowledge_status
      - has_unacked_revisions
      - amount
      - occupancy
      - guarantee
      - agent
      - raw_message
      - is_crs_revision
      - inserted_at
      - status
      - property_id
      - arrival_date
      - departure_date
      - ota_name
      - currency
      - ota_reservation_code
      - arrival_hour
      - services
      - payment_collect
      - payment_type
      - ota_commission
      - notes
      - meta
      - customer
      - rooms
      - deposits
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: Unique booking identifier.
          examples:
          - 603e8e9e-cc67-4ca7-bd13-3c407c6c3bbd
        booking_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: Unique booking identifier (same as `id`).
        revision_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: UUID of the latest revision of the booking.
        channel_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the associated Channel, when known.
        unique_id:
          type: string
          description: Unique booking identifier combined from the OTA code and the OTA reservation code.
          examples:
          - BDC-1556013801
        secondary_ota:
          anyOf:
          - type: string
          - type: 'null'
          description: Secondary OTA the booking came through, when applicable (e.g. `MakeMyTrip`).
        acknowledge_status:
          $ref: '#/components/schemas/BookingRevisions.AcknowledgeStatus'
        has_unacked_revisions:
          type: boolean
          description: Whether the booking has revisions that have not been acknowledged yet.
        amount:
          type: string
          description: Total booking amount as a decimal string.
          examples:
          - '220.00'
        occupancy:
          allOf:
          - $ref: '#/components/schemas/BookingRevisions.BookingOccupancy'
          description: Total booking occupancy.
        guarantee:
          anyOf:
          - $ref: '#/components/schemas/BookingRevisions.BookingGuarantee'
          - type: 'null'
          description: Credit card provided as payment guarantee, when present.
        agent:
          description: Agent the booking was made through.
        raw_message:
          type: string
          description: Raw message received from the booking source, as a string (JSON or OTA-specific payload).
        is_crs_revision:
          type: boolean
          description: Whether the latest revision was produced by the CRS (e.g. via this API) rather than received from an OTA feed.
        inserted_at:
          type: string
          format: date-time
          description: When the booking was received at Channex (ISO 8601, no timezone offset).
          examples:
          - '2019-04-23T10:03:29.335485'
        status:
          allOf:
          - $ref: '#/components/schemas/BookingRevisions.BookingRevisionStatus'
          description: Status of the booking, matching its latest revision.
        property_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: UUID of the Property the booking belongs to.
        arrival_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Arrival date (`YYYY-MM-DD`).
        departure_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Departure date (`YYYY-MM-DD`).
        ota_name:
          type: string
          description: Name of the booking source.
          examples:
          - Booking.com
        currency:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.currency'
          description: Booking currency code.
        ota_reservation_code:
          type: string
          description: Original reservation code at the platform where the guest created the booking.
          examples:
          - '113'
        arrival_hour:
          anyOf:
          - type: string
          - type: 'null'
          description: Arrival time in `HH:MM` (24h) format.
          examples:
          - '10:00'
        services:
          type: array
          items:
            $ref: '#/components/schemas/BookingRevisions.BookingService'
          description: Services at booking level.
        payment_collect:
          anyOf:
          - $ref: '#/components/schemas/BookingRevisions.PaymentCollect'
          - type: 'null'
        payment_type:
          anyOf:
          - $ref: '#/components/schemas/BookingRevisions.PaymentType'
          - type: 'null'
        ota_commission:
          anyOf:
          - type: string
          - type: 'null'
          description: Commission amount charged by the OTA, as a decimal string. Currently available for Booking.com and Airbnb channels.
          examples:
          - '10.00'
        notes:
          anyOf:
          - type: string
          - type: 'null'
          description: Customer notes for the booking.
        meta:
          type: object
          unevaluatedProperties: {}
          description: Free-form custom meta-information to exchange with integrated partners.
        customer:
          $ref: '#/components/schemas/BookingRevisions.BookingCustomer'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/BookingRevisions.BookingRoom'
          description: Booking rooms.
        deposits:
          type: array
          items: {}
          description: Deposits associated with the booking.
      description: A booking — the current state of a reservation, reflecting its latest revision.
    BookingRevisions.PaymentType:
      type: string
      enum:
      - credit_card
      - bank_transfer
      description: 'How the payment is collected: a credit card associated with the booking, or a bank transfer from the OTA.'
    BookingRevisions.BookingRoomTax:
      type: object
      required:
      - name
      - type
      - total_price
      - is_inclusive
      properties:
        name:
          type: string
        type:
          anyOf:
          - type: string
          - type: 'null'
          description: Tax type, as a display name.
          examples:
          - City Tax
        total_price:
          type: string
          description: Total price of the tax as a decimal string.
          examples:
          - '2.92'
        is_inclusive:
          type: boolean
          description: Whether the tax is included in the room price.
        price_per_unit:
          type: string
          description: Price per unit as a decimal string.
        price_mode:
          type: string
          description: How the tax is applied (e.g. `Per booking`).
        nights:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of nights the tax applies to.
        persons:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of persons the tax applies to.
        version:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Tax record version.
      description: A tax associated with a booking room.
    BookingRevisions.BookingGuarantee:
      type: object
      required:
      - card_number
      - card_type
      - cardholder_name
      - cvv
      - expiration_date
      - is_virtual
      properties:
        card_number:
          type: string
          description: Masked credit card number.
          examples:
          - 411111******1111
        card_type:
          $ref: '#/components/schemas/BookingRevisions.CardType'
        cardholder_name:
          type: string
        cvv:
          type: string
          description: Masked CVV / CVC. Always `***` for non-secure connections.
        expiration_date:
          type: string
          description: Credit card expiration date in `MM/YYYY` format.
          examples:
          - 12/2021
        is_virtual:
          type: boolean
          description: Whether the card is a virtual credit card.
        token:
          anyOf:
          - type: string
          - type: 'null'
          description: Card token.
        meta:
          anyOf:
          - $ref: '#/components/schemas/BookingRevisions.BookingGuaranteeMeta'
          - type: 'null'
      description: 'Credit card provided as payment guarantee.


        Full card details are returned only to certified PCI DSS partners, and only over

        the secure endpoints: `secure-staging.channex.io` on staging and

        `secure.channex.io` in production. To be granted access, write to

        support@channex.io with the IP addresses to whitelist and your PCI DSS

        certificate. Over any other endpoint the card number and CVV arrive masked.'
    BookingRevisions.BookingRoom:
      type: object
      required:
      - booking_room_id
      - room_type_id
      - rate_plan_id
      - checkin_date
      - checkout_date
      - occupancy
      - guests
      - services
      - taxes
      - amount
      - days
      - ota_commission
      - ota_unique_id
      - is_cancelled
      - meta
      properties:
        booking_room_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: Unique booking room identifier.
        room_type_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: Associated Room Type. `null` when the room is not mapped.
        rate_plan_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: Associated Rate Plan. `null` when the room is not mapped.
        checkin_date:
          type: string
          format: date
          description: Check-in date (`YYYY-MM-DD`).
        checkout_date:
          type: string
          format: date
          description: Check-out date (`YYYY-MM-DD`).
        occupancy:
          $ref: '#/components/schemas/BookingRevisions.BookingOccupancy'
        guests:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/BookingRevisions.BookingGuest'
          - type: 'null'
          description: Guests of the room, when the OTA exposes them; `null` otherwise.
        services:
          type: array
          items:
            $ref: '#/components/schemas/BookingRevisions.BookingService'
          description: Services at room level.
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/BookingRevisions.BookingRoomTax'
        collected_taxes:
          type: array
          items:
            $ref: '#/components/schemas/BookingRevisions.BookingCollectedTax'
          description: Taxes already collected by the OTA, when the booking source reports any. Reported by Booking.com and Airbnb.
        amount:
          type: string
          description: Total booking room amount as a decimal string.
          examples:
          - '400.00'
        days:
          type: object
          unevaluatedProperties:
            type: string
          description: 'Price breakdown per stay date: `YYYY-MM-DD` → decimal string amount.'
        ota_commission:
          anyOf:
          - type: string
          - type: 'null'
          description: OTA commission for the room as a decimal string, when available.
        ota_unique_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Unique room ID at the OTA side. Available for a limited set of OTAs (currently Booking.com).
        is_cancelled:
          type: boolean
        meta:
          anyOf:
          - type: object
            unevaluatedProperties: {}
          - type: 'null'
          description: Free-form meta information (mapping, rate codes, cancel penalties, day breakdowns, policies, …). Can contain `parent_rate_plan_id` when the room is associated with a derived rate plan or occupancy option.
      description: A room of a booking.
    Common.Errors.InvalidArgumentsObject:
      type: object
      required:
      - code
      - title
      - details
      properties:
        code:
          type: string
          enum:
          - bad_request
        title:
          type: string
          enum:
          - Bad Request
        details:
          type: object
          unevaluatedProperties:
            type: array
            items:
              type: string
          description: Maps each invalid argument to the list of validation messages for that argument.
          examples:
          - id:
            - can't be blank
      description: Error object for invalid request arguments, adding per-argument messages.
    Common.Scalars.country:
      type: string
      minLength: 2
      maxLength: 2
      description: ISO 3166-1 alpha-2 country code.
      examples:
      - GB
    BookingRevisions.BookingService:
      type: object
      required:
      - name
      - type
      - price_mode
      - price_per_unit
      - total_price
      - nights
      - persons
      - is_inclusive
      properties:
        name:
          type: string
          description: Service name in English.
          examples:
          - Cancellation Fee
        type:
          type: string
          description: Kind of service, e.g. `Breakfast`, `Internet`, `Parking`. Free-form OTA-provided value.
          examples:
          - Breakfast
        price_mode:
          type: string
          description: How the price is applied. Free-form OTA-provided value with inconsistent casing (e.g. `Per stay`, `per_booking`).
          examples:
          - Per stay
        price_per_unit:
          type: string
          description: Price per unit as a decimal string.
          examples:
          - '1500.00'
        total_price:
          type: string
          description: Total calculated price as a decimal string.
          examples:
          - '1500.00'
        nights:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of nights the service is booked for.
        persons:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of persons the service is booked for.
        is_inclusive:
          type: boolean
          description: Whether the service price is included in the booking price.
        service_rph:
          anyOf:
          - type: string
          - type: 'null'
          description: Service RPH reference.
      description: A service (extra charge) attached to a booking or a booking room.
    BookingRevisions.BookingRevisionStatus:
      type: string
      enum:
      - new
      - modified
      - cancelled
      description: Status of a booking revision.
    BookingRevisions.BookingCollectedTax:
      type: object
      required:
      - name
      - type
      - total_price
      - is_inclusive
      properties:
        name:
          type: string
        type:
          anyOf:
          - type: string
          - type: 'null'
          description: Tax type, as a display name.
          examples:
          - City Tax
        total_price:
          type: string
          description: Total price of the tax as a decimal string.
          examples:
          - '2.92'
        is_inclusive:
          type: boolean
          description: Whether the tax is included in the room price.
        price_per_unit:
          type: string
          description: Price per unit as a decimal string.
        price_mode:
          type: string
          description: How the tax is applied (e.g. `Per booking`).
        nights:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of nights the tax applies to.
        persons:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of persons the tax applies to.
        version:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Tax record version.
        is_withheld:
          type: boolean
          description: Always `true` on a collected tax.
      description: A tax already collected by the OTA — also known as a withheld tax.
    Common.Scalars.email:
