paths:
  /webhooks:
    get:
      operationId: Webhooks_list
      summary: List webhooks
      description: List webhooks. Results are paginated and ordered by creation time, newest first.
      parameters:
      - $ref: '#/components/parameters/Webhooks.WebhookListParams.propertyId'
      - $ref: '#/components/parameters/Webhooks.WebhookListParams.isActive'
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.page'
      - $ref: '#/components/parameters/Common.Pagination.PaginationParams.limit'
      - $ref: '#/components/parameters/Webhooks.WebhookListParams.orderInsertedAt'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhooks.WebhookResource'
                  meta:
                    $ref: '#/components/schemas/Common.Pagination.PaginationMeta'
                description: JSON:API document wrapping a collection of resources with pagination meta.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '403':
          description: The authenticated user lacks permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Forbidden'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.InvalidNestedArguments'
      tags:
      - Webhooks
    post:
      operationId: Webhooks_create
      summary: Create a webhook
      description: 'Create a webhook. `property_id` is required unless `is_global` is true, and one

        account may hold only one webhook per `callback_url` and `event_mask` pair. A

        webhook is inactive until `is_active` is set, and the created webhook is returned with

        `201 Created`.'
      parameters: []
      responses:
        '201':
          description: 201 Created response wrapping a resource body.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Webhooks.WebhookResource'
                description: JSON:API document wrapping a single resource.
        '400':
          description: The request body could not be parsed as JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.UnparsableRequest'
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '403':
          description: The authenticated user lacks permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Forbidden'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.ValidationError'
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.WebhookCreateRequest'
  /webhooks/events:
    get:
      operationId: WebhookEventCatalog_events
      summary: List webhook events
      description: List every event type a webhook can subscribe to. Not paginated.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Webhooks.WebhookEvents'
                description: JSON:API document wrapping a single resource.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
      tags:
      - Webhooks
  /webhooks/test:
    post:
      operationId: WebhookTest_test
      summary: Test a callback URL
      description: 'Send a test POST to the callback URL and return what the target answered — its status

        code and body, whatever they are, plus the attempt as a `delivery` log entry. A

        target that answers `405` or `404` is reported, not treated as an error. Neither the

        webhook nor the delivery entry is stored.'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhooks.WebhookTestResult'
        '400':
          description: The request body could not be parsed as JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.UnparsableRequest'
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.InvalidNestedArguments'
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.WebhookUpdateRequest'
  /webhooks/{id}:
    get:
      operationId: Webhooks_read
      summary: Retrieve a webhook
      description: Retrieve a webhook by its identifier.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Webhooks.WebhookResource'
                description: JSON:API document wrapping a single resource.
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFound'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InvalidArguments'
      tags:
      - Webhooks
    put:
      operationId: Webhooks_update
      summary: Update a webhook
      description: 'Update a webhook by its identifier. Attributes absent from the request are left

        unchanged. `is_global` cannot be changed after creation, and a protected webhook

        cannot be updated: the request answers `422` naming the flag.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Webhooks.WebhookResource'
                description: JSON:API document wrapping a single resource.
        '400':
          description: The request body could not be parsed as JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.UnparsableRequest'
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFound'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.ValidationError'
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.WebhookUpdateRequest'
    delete:
      operationId: Webhooks_delete
      summary: Delete a webhook
      description: 'Delete a webhook by its identifier. Its delivery log goes with it. A protected

        webhook cannot be deleted: the request answers `422` naming the flag.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.JsonApi.SuccessMessage'
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFound'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.ValidationError'
      tags:
      - Webhooks
  /webhooks/{id}/test:
    post:
      operationId: WebhookTest_testWebhook
      summary: Test a webhook
      description: 'Send a test POST through a stored webhook and return what the target answered.

        The request body is optional: attributes carried in it override the stored

        configuration for this test only and are validated like on the callback-URL test.

        The attempt is stored in the webhook''s delivery log with `is_test: true`; test

        entries are not counted in delivery statistics.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Scalars.id'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhooks.WebhookTestResult'
        '400':
          description: The request body could not be parsed as JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.UnparsableRequest'
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Unauthorized'
        '403':
          description: The authenticated user lacks permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.Forbidden'
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFound'
        '422':
          description: The request has missing or invalid arguments; `details` lists the messages per argument.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Common.Errors.InvalidArguments'
                - $ref: '#/components/schemas/Common.Errors.ValidationError'
      tags:
      - Webhooks
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.WebhookUpdateRequest'
components:
  schemas:
    Webhooks.WebhookHmac:
      type: object
      required:
      - signatures
      - signing_keys
      - timestamp
      properties:
        signatures:
          type: array
          items:
            type: string
          description: Lowercase-hex HMAC-SHA256 signatures sent, the current key's first.
        signing_keys:
          type: array
          items:
            type: string
          description: Masked labels (`...` + last 6 of the secret) of the signing key versions used, in the same order.
          examples:
          - - '...4f9c2a'
        timestamp:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
          description: Unix-seconds timestamp of the signing string, as sent in `x-hmac-timestamp`.
          examples:
          - 1758100512
      description: 'HMAC facts of a signed request: what was sent in the `x-hmac-*` headers,

        broken out per signing key version.'
    Common.Errors.ValidationError:
      type: object
      required:
      - errors
      properties:
        errors:
          $ref: '#/components/schemas/Common.Errors.ValidationErrorObject'
      description: The request body failed validation.
    Webhooks.WebhookCreateRequest:
      type: object
      required:
      - webhook
      properties:
        webhook:
          $ref: '#/components/schemas/Webhooks.WebhookCreate'
      description: Request body accepted when creating a webhook.
    Common.Errors.UnparsableRequest:
      type: object
      required:
      - errors
      properties:
        errors:
          $ref: '#/components/schemas/Common.Errors.UnparsableRequestObject'
      description: The request body could not be parsed as JSON.
    SigningKeys.SigningKey:
      type: object
      required:
      - id
      - inserted_at
      - updated_at
      - rotated_at
      - title
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: Unique signing key identifier. Mirrors the top-level resource `id`.
          examples:
          - f2b45efc-9917-44f5-b6ac-3c26468bdb47
        inserted_at:
          type: string
          format: date-time
          description: When the key was created (ISO 8601, no timezone offset).
          examples:
          - '2026-06-17T02:56:37.717460'
        updated_at:
          type: string
          format: date-time
          description: When the key was last updated (ISO 8601, no timezone offset).
          examples:
          - '2026-06-17T02:56:37.717460'
        rotated_at:
          anyOf:
          - type: string
          - type: 'null'
          format: date-time
          description: When the key was last rotated (ISO 8601, no timezone offset). Null until the first rotation.
          examples:
          - '2026-09-17T09:05:12.331907'
        title:
          type: string
          description: Human-readable name of the key.
          examples:
          - Production signing key
      description: 'An HMAC signing key for webhook deliveries. The secrets live in the key''s

        versions and are masked to `...` + last 6 everywhere except the create

        and generate responses.'
    Webhooks.WebhookCreate:
      type: object
      required:
      - callback_url
      - event_mask
      properties:
        callback_url:
          type: string
          format: uri
          description: URL called via POST when a subscribed trigger event occurs. Must carry a scheme and a resolvable host.
          examples:
          - https://your-website.com/api/push_message
        event_mask:
          $ref: '#/components/schemas/Webhooks.EventMask'
        request_params:
          anyOf:
          - type: object
            unevaluatedProperties:
              type: string
          - type: 'null'
          description: Additional GET query parameters appended to the callback request, or null when none are set.
        headers:
          anyOf:
          - type: object
            unevaluatedProperties:
              type: string
          - type: 'null'
          description: 'Custom request headers for the callback request, or null when none are set. Use this

            to authenticate against a protected endpoint, e.g.

            `{ "Authorization": "Basic user:password" }`.'
        is_active:
          type: boolean
          description: Whether the webhook is active. Only active webhooks receive notifications. `false` by default.
          examples:
          - true
        send_data:
          type: boolean
          description: 'Whether to include event payload data in the callback. When `false`, the delivery

            carries `event`, `property_id`, `user_id` and `timestamp` and no `payload`. `false`

            by default.'
          examples:
          - true
        is_global:
          type: boolean
          description: 'Whether the webhook receives events from every property of the billing account rather

            than from one. `false` by default, and fixed after creation: a property-level webhook

            cannot be converted to a global one.


            A global and a property-level webhook can cover the same event. When they point at

            different callback URLs both are delivered; when they point at the same one the

            delivery is made once, with the property-level webhook''s settings.'
          examples:
          - false
        is_signed:
          type: boolean
          description: 'Whether deliveries are signed. When `true`, every callback request carries the

            `x-hmac-timestamp`, `x-hmac-signature-256` and `x-hmac-keys-256` headers, computed

            with the key referenced by `signing_key_id`. The Webhook Signing Keys resource

            describes the signed string and how to verify a delivery. `false` by default.'
          examples:
          - false
        signing_key_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: 'UUID of the signing key deliveries are signed with, or null when none is assigned.

            Required whenever `is_signed` is true; the key must belong to a billing account the

            caller is a member of. Responses also expose the key, with its masked versions,

            through the `signing_key` relationship.'
        property_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: 'UUID of the property to associate the webhook with. Required unless `is_global` is

            true; a request that omits both answers `422`.'
          examples:
          - 716305c4-561a-4561-a187-7f5b8aeb5920
      description: Attributes accepted when creating a webhook.
    Common.Scalars.nonNegativeInt:
      type: integer
      format: int32
      minimum: 0
    Common.Scalars.positiveInt:
      type: integer
      format: int32
      minimum: 1
    Webhooks.WebhookEvents:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.WebhookEvent'
      description: The webhook event types available for subscription.
    SigningKeys.SigningKeyWebhookResource:
      type: object
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - webhook
        id:
          $ref: '#/components/schemas/Common.Scalars.id'
        attributes:
          $ref: '#/components/schemas/SigningKeys.SigningKeyWebhook'
      description: A webhook that signs its deliveries with the key.
    Webhooks.WebhookEvent:
      type: string
      enum:
      - ari
      - booking
      - booking_new
      - booking_modification
      - booking_cancellation
      - booking_unmapped_room
      - booking_unmapped_rate
      - non_acked_booking
      - message
      - sync_error
      - sync_warning
      - rate_error
      - reservation_request
      - alteration_request
      - accepted_reservation
      - declined_reservation
      - inquiry
      - review
      - updated_review
      - published_review
      - new_channel
      - updated_channel
      - disconnect_channel
      - disconnect_listing
      - activate_channel
      - deactivate_channel
      - channel_removal_warning
      - property_removal_warning
      - message_thread_booking_assigned
      - booking_invalid_guarantee
      - airbnb_notification
      description: Webhook event types that can trigger a push notification.
    Webhooks.EmbeddedWebhookBillingAccount:
      type: object
      required:
      - id
      - type
      properties:
        id:
          $ref: '#/components/schemas/Common.Scalars.id'
        type:
          type: string
          enum:
          - billing_account
      description: The billing account a webhook belongs to.
    Webhooks.WebhookResource:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      properties:
        type:
          type: string
          enum:
          - webhook
        id:
          $ref: '#/components/schemas/Common.Scalars.id'
        attributes:
          $ref: '#/components/schemas/Webhooks.Webhook'
        relationships:
          $ref: '#/components/schemas/Webhooks.WebhookRelationships'
      description: 'A webhook resource: the subscription attributes plus the property and account it belongs to.'
    Common.Errors.InvalidArgumentsObject:
      type: object
      required:
      - code
      - title
      - details
      properties:
        code:
          type: string
          enum:
          - bad_request
        title:
          type: string
          enum:
