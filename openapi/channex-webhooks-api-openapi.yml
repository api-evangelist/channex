            identifying the version in the `x-hmac-keys-256` delivery header and in API

            responses. The full secret is never rendered here.'
          examples:
          - '...i_rH1w'
        inserted_at:
          type: string
          format: date-time
          description: When the version was created (ISO 8601, no timezone offset).
          examples:
          - '2026-06-17T02:56:37.717460'
      description: A secret version of a signing key.
    Webhooks.WebhookRelationships:
      type: object
      required:
      - billing_account
      - organization
      properties:
        property:
          type: object
          properties:
            data:
              $ref: '#/components/schemas/Webhooks.EmbeddedWebhookProperty'
          required:
          - data
          description: The property the webhook watches. Absent for a global webhook.
        billing_account:
          type: object
          properties:
            data:
              $ref: '#/components/schemas/Webhooks.EmbeddedWebhookBillingAccount'
          required:
          - data
          description: The billing account the webhook belongs to.
        organization:
          type: object
          properties:
            data:
              $ref: '#/components/schemas/Webhooks.EmbeddedWebhookOrganization'
          required:
          - data
          description: The organization the webhook belongs to.
        signing_key:
          type: object
          properties:
            data:
              $ref: '#/components/schemas/SigningKeys.SigningKeyResource'
          required:
          - data
          description: The signing key deliveries are signed with, with its versions masked. Absent when no key is assigned.
      description: 'Relationships of a webhook: the property it watches, and the account it belongs to.'
