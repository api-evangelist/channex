    Webhooks.WebhookTestDelivery:
      type: object
      required:
      - id
      - webhook_id
      - property_id
      - event
      - is_test
      - success
      - status_code
      - error
      - response_time
      - attempt
      - is_signed
      - callback_url
      - payload
      - request_headers
      - response_headers
      - response
      - user_id
      - started_at
      - finished_at
      - inserted_at
      properties:
        id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: Identifier the entry gets once stored. Null in the test response.
        webhook_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the tested webhook. Null for the callback-URL test, which is bound to no webhook.
        property_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the property associated with the tested webhook. Null for the callback-URL test and for a global webhook.
        event:
          type: string
          enum:
          - test
          description: Always `test`.
        is_test:
          type: boolean
          enum:
          - true
          description: 'Always `true`: the entry was written by a test, not by a live delivery.'
        success:
          type: boolean
          description: Whether the test delivery succeeded.
          examples:
          - true
        status_code:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: HTTP status code returned by the callback URL. Null when no response was received.
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: Failure reason (e.g. `timeout`), or null on success.
        response_time:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Delivery round-trip time in milliseconds.
          examples:
          - 583
        attempt:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: 'Always `0`: a test is never retried.'
        is_signed:
          type: boolean
          description: Whether the test request was HMAC-signed.
        hmac:
          allOf:
          - $ref: '#/components/schemas/Webhooks.WebhookHmac'
          description: HMAC facts of the test request. Omitted when unsigned.
        callback_url:
          type: string
          format: uri
          description: Callback URL the test request was sent to.
          examples:
          - https://your-website.com/api/push_message
        payload:
          type: string
          description: 'Serialized JSON payload of the test: always the standard test body — a `payload`

            given in the request is ignored. The delivered body omits it when `send_data` is

            false.'
          examples:
          - '{"hello":"world"}'
        request_headers:
          type: string
          description: Serialized JSON request headers sent with the test request.
          examples:
          - '{"Content-type":"application/json"}'
        response_headers:
          anyOf:
          - type: string
          - type: 'null'
          description: Serialized JSON response headers returned by the callback URL. Null when no response was received.
        response:
          anyOf:
          - type: string
          - type: 'null'
          description: Response body returned by the callback URL, or the failure reason.
        user_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the user who ran the test. Null when it was run by the system.
        started_at:
          type: string
          format: date-time
          description: When the test attempt started (ISO 8601, no timezone offset).
          examples:
          - '2026-09-23T14:09:24.058655'
        finished_at:
          type: string
          format: date-time
          description: When the test attempt finished (ISO 8601, no timezone offset).
          examples:
          - '2026-09-23T14:09:24.641801'
        inserted_at:
          type: string
          format: date-time
          description: When the entry was written (ISO 8601, no timezone offset).
          examples:
          - '2026-09-23T14:09:24.641801'
      description: A webhook test attempt in the shape of a delivery log entry.
