      explode: false
    TaxSets.TaxSetOptionsParams:
      name: filter[property_id]
      in: query
      required: false
      description: Return only the tax sets of this property.
      schema:
        $ref: '#/components/schemas/Common.Scalars.id'
      explode: false
    Common.Pagination.PaginationParams.page:
