      - title
      - occ_adults
      - occ_children
      - occ_infants
      - default_occupancy
      - position
      - photo
      - property_id
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          examples:
          - 994d1375-dbbd-4072-8724-b2ab32ce781b
        title:
          type: string
          examples:
          - Standard Room
        occ_adults:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.positiveInt'
          description: Number of adult bed spaces in the room type.
          examples:
          - 3
        occ_children:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of child-only bed spaces.
          examples:
          - 0
        occ_infants:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of infant cots available in the room type.
          examples:
          - 0
        default_occupancy:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.positiveInt'
          description: Guests accommodated by default without extra spaces.
          examples:
          - 2
        position:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Zero-based display position of the room type. Set with the `update_positions` endpoint.
          examples:
          - 0
        photo:
          anyOf:
          - type: string
          - type: 'null'
          format: uri
          description: URL of the room type's photo. `null` when the room type has no photo.
          examples:
          - https://images.channex.io/cce1fbdb-e7be-4804-1f71-f7617cb7cc00/
        property_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: UUID of the property the room type belongs to.
          examples:
          - 2941337f-50d6-4189-ae13-f76efaf9c515
      description: 'Attributes of a room type `/options` item: identifier, title, occupancy, display position, photo, and owning property.'
    Photos.EmbeddedPhotoWrite:
      type: object
      required:
      - url
      - kind
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: UUID of an existing photo of this parent to update in place or, with `is_removed`, to remove. Omit to attach a new photo. An identifier naming no photo of this parent leaves the list unchanged.
          examples:
          - cc673f90-8d65-498d-9ee7-b4b39f8df3ee
        url:
          type: string
          format: uri
          description: 'URL to fetch the image from: the temporary URL returned by the upload endpoint, passed unchanged, or any reachable image URL. The image is copied into Channex storage, and responses carry that copy''s URL rather than this one. Required in every entry; an entry without `id` whose URL matches a photo already attached updates that photo.'
          examples:
          - https://example.com/temporaryphotos/a66edb22-47da-4da8-bab5-3b6f4056256f.png
        kind:
          allOf:
          - $ref: '#/components/schemas/Photos.PhotoKind'
          description: Kind of photo. Required when attaching or updating a photo; an entry that only removes one may omit it.
        author:
          anyOf:
          - type: string
          - type: 'null'
          description: Photo author, or null.
          examples:
          - John Doe
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Photo description, or null.
          examples:
          - Room View
        is_removed:
          type: boolean
          description: Set to `true` to remove the photo named by `id` or `url` from the parent. The photo is deleted and is no longer readable through the Photos resource. Defaults to `false`.
      description: A photo in a parent resource's `content.photos` list.
    RoomTypes.RoomType:
      type: object
      required:
      - id
      - position
      - title
      - count_of_rooms
      - occ_adults
      - occ_children
      - occ_infants
      - default_occupancy
      - room_kind
      - capacity
      - codes
      - meta
      - content
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: Unique room type identifier.
          examples:
          - 994d1375-dbbd-4072-8724-b2ab32ce781b
        position:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Zero-based display position of the room type. Set with the `update_positions` endpoint.
          examples:
          - 0
        title:
          type: string
          maxLength: 255
          description: Room type title, as shown in the system. Unique within the property.
          examples:
          - Standard Room
        count_of_rooms:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.positiveInt'
          description: Number of rooms (units) of this type available to sell. Affects billing for vacation rentals.
          examples:
          - 20
        occ_adults:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.positiveInt'
          description: Number of adult bed spaces in the room type.
          examples:
          - 3
        occ_children:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of child-only bed spaces. Children may also sleep in adult beds; set to 0 if there are no child-only beds.
          examples:
          - 0
        occ_infants:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Number of infant cots available in the room type.
          examples:
          - 0
        default_occupancy:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.positiveInt'
          description: Guests accommodated by default without extra spaces. Defaults to `occ_adults` and is silently lowered to it when a larger value is sent. Lowering `occ_adults` lowers this too.
          deprecated: true
          examples:
          - 2
        room_kind:
          allOf:
          - $ref: '#/components/schemas/RoomTypes.RoomKind'
          description: Kind of room type. Defaults to `room`.
        capacity:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Number of beds in a single physical room, used for `dorm` room types. Stored and returned whatever the `room_kind`; `null` until set.
          examples:
          - 4
        codes:
          anyOf:
          - type: object
            unevaluatedProperties: {}
          - type: 'null'
          description: 'Free-form object stored for the client''s own use, or null. The platform neither reads nor writes it: an object sent here comes back unchanged.'
          examples:
          - pms: RT-42
        meta:
          anyOf:
          - type: object
            unevaluatedProperties: {}
          - type: 'null'
          description: 'Free-form object stored for the client''s own use, or null. The platform neither reads nor writes it: an object sent here comes back unchanged.'
        content:
          $ref: '#/components/schemas/RoomTypes.RoomTypeContent'
      description: 'A room type (an accommodation inventory unit — a room, villa, or dormitory bed) as returned in responses: every attribute is present.'
    RoomTypes.RoomKind:
      type: string
      enum:
      - room
      - dorm
      description: Kind of room type. A `dorm` sells beds within a shared physical room; a `room` sells the whole unit.
    Photos.Photo:
      type: object
      required:
      - id
      - property_id
      - room_type_id
      - kind
      - position
      - author
      - description
      - url
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: Unique photo identifier.
          examples:
          - cc673f90-8d65-498d-9ee7-b4b39f8df3ee
        property_id:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          description: UUID of the Property the photo belongs to. Cannot be changed after the photo is created.
          examples:
          - 52397a6e-c330-44f4-a293-47042d3a3607
        room_type_id:
          anyOf:
          - $ref: '#/components/schemas/Common.Scalars.id'
          - type: 'null'
          description: UUID of the Room Type the photo belongs to, or null when the photo is attached at property level. Cannot be changed after the photo is created.
        kind:
          allOf:
          - $ref: '#/components/schemas/Photos.PhotoKind'
          description: 'Kind of photo: `photo` for the property or room type itself, `ad` for an advertising image, `menu` for a restaurant menu. Defaults to `photo`.'
        position:
          allOf:
          - $ref: '#/components/schemas/Common.Scalars.nonNegativeInt'
          description: Position in the photo list of the property or, for a room type photo, of that room type. Positions run from `0` without gaps and `0` designates the cover photo. On create the photo is inserted at this position, or appended when omitted; on update it is moved there. The other photos shift to keep the positions contiguous, and a value past the end places the photo last.
          examples:
          - 0
        author:
          anyOf:
          - type: string
          - type: 'null'
          description: Photo author, or null. An empty string is stored as `null`.
          examples:
          - John Doe
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Photo description, or null. An empty string is stored as `null`.
          examples:
          - Room View
        url:
          type: string
          format: uri
          description: URL of the image as served by Channex. The create response carries a placeholder image URL; once the source image has been fetched and stored, typically within a few seconds, the photo carries the URL of the stored copy — read the photo back to obtain it. A source image that cannot be fetched leaves the placeholder in place.
          examples:
          - https://images.channex.io/1747b751-28c0-47db-742a-40f62a186a00/
      description: 'A photo as returned in responses: every attribute is present.'
